# ═══════════════════════════════════════════════════════════════
#  netlify.toml — devops.houstonalert.com
#  4th and Bailey LLC · © 2026
#
#  Verify headers at: https://securityheaders.com
#  Target grade: A+
# ═══════════════════════════════════════════════════════════════

# ── BUILD SETTINGS ───────────────────────────────────────────────
[build]
  publish   = "/"          # Static site — publish root directly
  command   = ""           # No build step required for static HTML

# ── HTTPS REDIRECT ───────────────────────────────────────────────
# Force all HTTP traffic to HTTPS
[[redirects]]
  from   = "http://devops.houstonalert.com/*"
  to     = "https://devops.houstonalert.com/:splat"
  status = 301
  force  = true

# Force www → non-www (canonical domain)
[[redirects]]
  from   = "https://www.devops.houstonalert.com/*"
  to     = "https://devops.houstonalert.com/:splat"
  status = 301
  force  = true

# ── SECURITY HEADERS (all pages) ─────────────────────────────────
[[headers]]
  for = "/*"

  [headers.values]

    # Prevent clickjacking — no iframing of this page
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Legacy XSS filter (belt-and-suspenders for older browsers)
    X-XSS-Protection = "1; mode=block"

    # Control referrer information sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict browser feature access
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=()"

    # HSTS — tell browsers to always use HTTPS (2-year max-age)
    # Add to preload list at: https://hstspreload.org/
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Content Security Policy
    # — Tighten the script-src 'unsafe-inline' once GTM nonce support is configured
    # — Update connect-src if backend API domain changes
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline'
        https://www.googletagmanager.com
        https://www.google-analytics.com
        https://www.clarity.ms
        https://fonts.googleapis.com;
      style-src 'self' 'unsafe-inline'
        https://fonts.googleapis.com;
      font-src 'self'
        https://fonts.gstatic.com;
      img-src 'self' data: https:;
      connect-src 'self'
        https://www.google-analytics.com
        https://analytics.google.com
        https://www.clarity.ms
        https://region1.google-analytics.com;
      frame-src
        https://www.googletagmanager.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    """

    # Cross-Origin policies
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

# ── CACHING — static assets (long TTL) ───────────────────────────
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── CACHING — HTML (short TTL, always revalidate) ────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── CACHING — sitemap & robots (short TTL) ───────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type  = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
